<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Goodgallery — Admin</title>
<link rel="stylesheet" href="/_static/goodgallery.css" />
<link rel="icon" type="image/svg+xml" href="/_static/favicon.svg" />
<style>
  body { padding: 16px; max-width: 900px; margin: 0 auto; height: auto; overflow: auto; }
  h1 { font-size: 22px; font-weight: 500; margin: 8px 0 16px; }
  .panel { background: #141414; border: 1px solid #2a2a2a; border-radius: 6px; padding: 16px; margin-bottom: 14px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
  input[type=text], input[type=password] {
    background: #000; color: #cfcfcf; border: 1px solid #444;
    padding: 8px 10px; font: inherit; flex: 1; min-width: 160px; border-radius: 3px;
  }
  .err { color: #ff8585; min-height: 1.2em; }
  .ok  { color: #9bff9b; }
  .hidden { display: none !important; }
  ul.files { list-style: none; padding: 0; margin: 0; max-height: 280px; overflow: auto; border: 1px solid #2a2a2a; border-radius: 4px; }
  ul.files li { padding: 6px 10px; border-bottom: 1px solid #1f1f1f; display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 13px; }
  ul.files li:last-child { border-bottom: 0; }
  .progress { height: 4px; background: #222; border-radius: 2px; overflow: hidden; margin-top: 4px; }
  .progress > div { height: 100%; background: #4caf50; width: 0%; transition: width .15s; }
  .pathbar { font-family: ui-monospace, Menlo, monospace; padding: 8px 10px; background: #000; border: 1px solid #2a2a2a; border-radius: 3px; word-break: break-all; }
  .drop { border: 2px dashed #444; border-radius: 6px; padding: 24px; text-align: center; color: #888; }
  .drop.over { border-color: #cfcfcf; color: #cfcfcf; background: #1a1a1a; }
  small { color: #888; }
</style>
</head>
<body onkeyup="unlockkeys(event)" onkeydown="keycheck(event)">

<h1 style="display:flex;align-items:center;gap:12px">
  <a href="/" style="text-decoration:none;font-size:18px;opacity:0.6" title="Back to gallery">←</a>
  <a href="/" style="color:inherit;text-decoration:none">Goodgallery</a>
  <span style="color:#888;font-size:18px">— Admin</span>
</h1>

<div id="authPanel" class="panel">
  <div id="authTitle" style="font-size:18px;margin-bottom:6px">Admin</div>
  <div id="authDesc" style="color:#888;margin-bottom:10px">Checking…</div>
  <button id="authBtn" disabled>Please wait…</button>
  <div id="authError" class="err" style="margin-top:8px"></div>
  <div style="margin-top:8px"><small>Requires HTTPS (or localhost) and a Chromium-based browser for WebAuthn + the File System APIs used during mass upload.</small></div>
</div>

<div id="adminMain" class="hidden">

  <div class="panel">
    <div class="row">
      <strong>Folder:</strong>
      <span id="cwd" class="pathbar">/</span>
      <button id="upBtn">↑ up</button>
      <button id="reloadBtn">↻ reload</button>
      <button id="logoutBtn" style="margin-left:auto">Log out</button>
    </div>
    <div class="row">
      <input id="newDirName" type="text" placeholder="new subfolder name" />
      <button id="mkDirBtn">+ folder</button>
    </div>
    <div id="dirError" class="err"></div>
  </div>

  <div class="panel">
    <strong>Subfolders</strong>
    <ul id="folders" class="files"><li><small>Loading…</small></li></ul>
  </div>

  <div class="panel">
    <strong>Upload</strong>
    <div id="drop" class="drop" tabindex="0">
      <div>Drop image files (or a folder) here, or
        <button id="pickBtn">pick files</button>
        <button id="pickFolderBtn">pick folder</button>
      </div>
      <input id="filePicker" type="file" multiple accept="image/*" hidden />
      <input id="folderPicker" type="file" webkitdirectory hidden />
    </div>
    <div id="uploadList"></div>
  </div>

  <div class="panel">
    <strong>Images in this folder</strong>
    <span id="imgCount" style="color:#888;font-size:12px;margin-left:8px"></span>
    <ul id="images" class="files"><li><small>Loading…</small></li></ul>
    <div class="row" style="margin-top:8px">
      <button id="validateBtn">Validate / build all</button>
      <button id="clearCacheBtn">Clear cache</button>
      <button id="fullRescanBtn" title="Re-scan every gallery for files added outside the uploader (e.g. rsync, mv).">Full rescan</button>
      <button id="exploreTrashBtn">Explore trash</button>
    </div>
    <pre id="actionLog" style="font-size:12px;color:#9bff9b;max-height:120px;overflow:auto;margin-top:8px"></pre>
  </div>

</div>

<script>
// ---------- WebAuthn helpers ----------
function b64ToBuf(s) {
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  s += '='.repeat((4 - s.length % 4) % 4);
  var bin = atob(s); var out = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out.buffer;
}
function bufToB64(buf) {
  var b = new Uint8Array(buf), s = '';
  for (var i=0;i<b.length;i++) s += String.fromCharCode(b[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

// Auth is an HttpOnly cookie set by the server on login finish. We never see the token
// in JS, which means XSS can't read it; CSRF is mitigated by SameSite=Strict.
var cwdPath = '/'; // gallery folder we're administrating
function authHeaders() { return {}; }  // legacy stub — fetches use cookies automatically

function unlockkeys(){}
function keycheck(){}

async function checkAuth() {
  var t = document.getElementById('authTitle');
  var d = document.getElementById('authDesc');
  var b = document.getElementById('authBtn');
  var err = document.getElementById('authError');

  if (!window.PublicKeyCredential) {
    t.textContent = 'WebAuthn unavailable';
    d.textContent = 'Open this page over HTTPS or via http://localhost.';
    b.style.display = 'none';
    return;
  }

  // Cookie is sent automatically with this request; if it's valid, skip to main.
  var probe = await fetch('/api/admin/probe', { credentials: 'same-origin' }).then(r => r.ok).catch(() => false);
  if (probe) { showMain(); return; }

  var status = await fetch('/api/admin/status').then(r => r.json()).catch(() => null);
  if (!status) { err.textContent = 'Cannot reach server.'; return; }
  if (!status.passkeyExists) {
    t.textContent = 'First-time setup';
    d.textContent = 'Create a passkey to claim admin access. Anyone who beats you to this loses you the gallery, so do this immediately.';
    b.textContent = 'Create passkey';
    b.disabled = false;
    b.onclick = registerPasskey;
  } else {
    t.textContent = 'Sign in';
    d.textContent = 'Authenticate with your passkey.';
    b.textContent = 'Sign in with passkey';
    b.disabled = false;
    b.onclick = loginPasskey;
  }
}

async function registerPasskey() {
  var b = document.getElementById('authBtn');
  var err = document.getElementById('authError');
  b.disabled = true; err.textContent = '';
  try {
    var opts = await fetch('/api/admin/register/start', { method: 'POST' }).then(r => r.json());
    if (opts.error) throw new Error(opts.error);
    opts.challenge = b64ToBuf(opts.challenge);
    opts.user.id = b64ToBuf(opts.user.id);
    var cred = await navigator.credentials.create({ publicKey: opts });
    var verify = await fetch('/api/admin/register/finish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: cred.id,
        rawId: bufToB64(cred.rawId),
        type: cred.type,
        response: {
          clientDataJSON: bufToB64(cred.response.clientDataJSON),
          attestationObject: bufToB64(cred.response.attestationObject),
        },
      }),
    }).then(r => r.json());
    if (!verify.success) throw new Error(verify.error || 'register failed');
    showMain();  // server set the HttpOnly session cookie
  } catch (e) {
    err.textContent = e.message || 'register failed';
  } finally {
    b.disabled = false;
  }
}

async function loginPasskey() {
  var b = document.getElementById('authBtn');
  var err = document.getElementById('authError');
  b.disabled = true; err.textContent = '';
  try {
    var opts = await fetch('/api/admin/login/start', { method: 'POST' }).then(r => r.json());
    if (opts.error) throw new Error(opts.error);
    opts.challenge = b64ToBuf(opts.challenge);
    if (opts.allowCredentials) {
      opts.allowCredentials = opts.allowCredentials.map(c => ({ ...c, id: b64ToBuf(c.id) }));
    }
    var cred = await navigator.credentials.get({ publicKey: opts });
    var verify = await fetch('/api/admin/login/finish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: cred.id,
        rawId: bufToB64(cred.rawId),
        type: cred.type,
        response: {
          clientDataJSON: bufToB64(cred.response.clientDataJSON),
          authenticatorData: bufToB64(cred.response.authenticatorData),
          signature: bufToB64(cred.response.signature),
          userHandle: cred.response.userHandle ? bufToB64(cred.response.userHandle) : null,
        },
      }),
    }).then(r => r.json());
    if (!verify.success) throw new Error(verify.error || 'login failed');
    showMain();  // server set the HttpOnly session cookie
  } catch (e) {
    err.textContent = e.message || 'login failed';
  } finally {
    b.disabled = false;
  }
}

function showMain() {
  document.getElementById('authPanel').classList.add('hidden');
  document.getElementById('adminMain').classList.remove('hidden');
  loadFolder();
}

// ---------- folder browse / actions ----------
function setCWD(p) {
  if (!p.startsWith('/')) p = '/' + p;
  if (!p.endsWith('/')) p += '/';
  cwdPath = p;
  document.getElementById('cwd').textContent = p;
  history.replaceState(null, '', '/_admin/?p=' + encodeURIComponent(p));
}

async function loadFolder() {
  var url = cwdPath + '?api=list';
  var r = await fetch(url, { headers: authHeaders() });
  if (!r.ok) {
    if (r.status === 404) {
      // folder vanished; reset to root
      setCWD('/'); return loadFolder();
    }
    return;
  }
  var data = await r.json();
  var folEl = document.getElementById('folders');
  var imgEl = document.getElementById('images');
  folEl.innerHTML = data.folders.length
    ? data.folders.map(n => `<li><a href="#" data-name="${escapeHtml(n)}">📁 ${escapeHtml(n)}</a></li>`).join('')
    : '<li><small>(no subfolders)</small></li>';
  folEl.querySelectorAll('a').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    setCWD(cwdPath + a.getAttribute('data-name') + '/');
    loadFolder();
  }));
  document.getElementById('imgCount').textContent = '(' + data.images.length + ')';
  imgEl.innerHTML = data.images.length
    ? data.images.map(n => `<li><a href="${escapeHtml(cwdPath + encodeURIComponent(n))}" target="_blank">${escapeHtml(n)}</a><button data-trash="${escapeHtml(n)}">trash</button></li>`).join('')
    : '<li><small>(empty)</small></li>';
  imgEl.querySelectorAll('button[data-trash]').forEach(b => b.addEventListener('click', () => trashImage(b.getAttribute('data-trash'))));
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function trashImage(name) {
  // No confirm — trash is reversible (Explore Trash button restores).
  var r = await fetch(cwdPath + '?movetotrash=' + encodeURIComponent(name), { method: 'POST', headers: authHeaders() });
  log(await r.text());
  loadFolder();
}

function log(s) {
  var el = document.getElementById('actionLog');
  el.textContent = (el.textContent + '\n' + s).split('\n').slice(-200).join('\n');
  el.scrollTop = el.scrollHeight;
}

document.getElementById('upBtn').addEventListener('click', () => {
  if (cwdPath === '/') return;
  var parts = cwdPath.split('/').filter(Boolean);
  parts.pop();
  setCWD('/' + parts.join('/') + (parts.length ? '/' : ''));
  loadFolder();
});
document.getElementById('reloadBtn').addEventListener('click', loadFolder);
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/admin/logout', { method: 'POST', credentials: 'same-origin' });
  location.reload();
});
document.getElementById('mkDirBtn').addEventListener('click', async () => {
  var name = document.getElementById('newDirName').value.trim();
  if (!name) return;
  var r = await fetch(cwdPath + '?mkdir=' + encodeURIComponent(name), { method: 'POST', headers: authHeaders() });
  if (!r.ok) document.getElementById('dirError').textContent = await r.text();
  else { document.getElementById('newDirName').value = ''; document.getElementById('dirError').textContent = ''; loadFolder(); }
});

document.getElementById('validateBtn').addEventListener('click', async () => {
  log('validating...');
  var r = await fetch(cwdPath + '?buildall=1', { headers: authHeaders() });
  log(await r.text());
});
document.getElementById('clearCacheBtn').addEventListener('click', async () => {
  if (!confirm('Clear all cached thumbs/previews in ' + cwdPath + '?')) return;
  var r = await fetch(cwdPath + '?clearcache=1', { method: 'POST', headers: authHeaders() });
  log(await r.text());
});
document.getElementById('exploreTrashBtn').addEventListener('click', exploreTrash);

document.getElementById('fullRescanBtn').addEventListener('click', async () => {
  log('full rescan...');
  var r = await fetch('/api/admin/fullrescan', { method: 'POST', credentials: 'same-origin' });
  var j = await r.json().catch(() => ({}));
  log(r.ok ? 'rescan started; check individual galleries for build progress.' : ('rescan failed: ' + (j.error || r.status)));
});

async function exploreTrash() {
  var trashEl = document.getElementById('trashPanel');
  if (!trashEl) {
    trashEl = document.createElement('div');
    trashEl.className = 'panel';
    trashEl.id = 'trashPanel';
    document.getElementById('adminMain').appendChild(trashEl);
  }
  trashEl.innerHTML = '<strong>Trash <small style="color:#888">(global)</small></strong><div id="trashList" style="margin-top:8px"><small>Loading…</small></div>';

  var r = await fetch('/api/trash', { headers: authHeaders() });
  var data = null; try { data = await r.json(); } catch (_) {}
  var listEl = document.getElementById('trashList');
  if (!data || !data.files || !data.files.length) {
    listEl.innerHTML = '<small>Trash is empty.</small>';
    return;
  }
  // Render origin path for each file so the user knows where it came from
  var rows = data.files.map(function (f) {
    var fromFolder = f.relPath.includes('/') ? f.relPath.slice(0, f.relPath.lastIndexOf('/')) : '/';
    return '<li><span>' + escapeHtml(f.name) +
           ' <small style="color:#888">from /' + escapeHtml(fromFolder === f.name ? '' : fromFolder) + '</small></span>' +
           '<span><button data-restore="' + escapeHtml(f.relPath) + '">Restore</button> ' +
           '<button data-delete="' + escapeHtml(f.relPath) + '">Delete</button></span></li>';
  }).join('');
  listEl.innerHTML = '<ul class="files">' + rows + '</ul>' +
    '<div class="row" style="margin-top:8px">' +
    '<button id="restoreAllBtn">Restore all</button>' +
    '<button id="emptyTrashBtn" style="margin-left:auto">Empty trash</button></div>';

  async function trashCall(url, body) {
    var rr = await fetch(url, {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
      body: body ? JSON.stringify(body) : undefined,
    });
    var j = null; try { j = await rr.json(); } catch (_) {}
    log((j && (j.message || j.error)) || (rr.ok ? 'ok' : 'http ' + rr.status));
  }

  listEl.querySelectorAll('button[data-restore]').forEach(b => b.addEventListener('click', async () => {
    await trashCall('/api/trash/restore', { path: b.getAttribute('data-restore') });
    exploreTrash(); loadFolder();
  }));
  listEl.querySelectorAll('button[data-delete]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Permanently delete ' + b.getAttribute('data-delete') + '? This cannot be undone.')) return;
    await trashCall('/api/trash/delete', { path: b.getAttribute('data-delete') });
    exploreTrash();
  }));
  document.getElementById('restoreAllBtn').addEventListener('click', async () => {
    await trashCall('/api/trash/restoreAll');
    exploreTrash(); loadFolder();
  });
  document.getElementById('emptyTrashBtn').addEventListener('click', async () => {
    if (!confirm('Permanently delete ALL trashed files? This cannot be undone.')) return;
    await trashCall('/api/trash/empty');
    exploreTrash();
  });
}

// ---------- upload ----------
var drop = document.getElementById('drop');
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', async e => {
  var items = e.dataTransfer && e.dataTransfer.items;
  if (items && items.length && items[0].webkitGetAsEntry) {
    for (var i=0;i<items.length;i++) {
      var entry = items[i].webkitGetAsEntry();
      if (entry) await uploadEntry(entry, cwdPath);
    }
    loadFolder();
  } else if (e.dataTransfer.files) {
    await uploadFiles(Array.from(e.dataTransfer.files), cwdPath);
    loadFolder();
  }
});
document.getElementById('pickBtn').addEventListener('click', () => document.getElementById('filePicker').click());
document.getElementById('pickFolderBtn').addEventListener('click', () => document.getElementById('folderPicker').click());
document.getElementById('filePicker').addEventListener('change', async e => {
  await uploadFiles(Array.from(e.target.files), cwdPath); e.target.value = ''; loadFolder();
});
document.getElementById('folderPicker').addEventListener('change', async e => {
  // each File has webkitRelativePath like "MyFolder/sub/img.jpg"
  var byFolder = new Map();
  for (var f of e.target.files) {
    var rel = f.webkitRelativePath || f.name;
    var parts = rel.split('/');
    var name = parts.pop();
    var dir = cwdPath + parts.map(encodeURIComponent).join('/') + (parts.length ? '/' : '');
    if (!byFolder.has(dir)) byFolder.set(dir, []);
    byFolder.get(dir).push({ file: f, name });
  }
  // create needed folders depth-first
  for (var dir of [...byFolder.keys()].sort()) {
    var pathSegs = dir.replace(/^\/|\/$/g,'').split('/');
    var here = '/';
    for (var seg of pathSegs) {
      if (!seg) continue;
      var dec = decodeURIComponent(seg);
      await fetch(here + '?mkdir=' + encodeURIComponent(dec), { method: 'POST', headers: authHeaders() });
      here += seg + '/';
    }
  }
  for (var [dir, items] of byFolder) {
    await uploadFiles(items.map(it => it.file), dir);
  }
  e.target.value = '';
  loadFolder();
});

async function uploadEntry(entry, parentPath) {
  if (entry.isFile) {
    var file = await new Promise(res => entry.file(res));
    await uploadFiles([file], parentPath);
  } else if (entry.isDirectory) {
    var dirPath = parentPath + encodeURIComponent(entry.name) + '/';
    await fetch(parentPath + '?mkdir=' + encodeURIComponent(entry.name), { method: 'POST', headers: authHeaders() });
    var reader = entry.createReader();
    var readBatch = () => new Promise(res => reader.readEntries(res));
    while (true) {
      var batch = await readBatch();
      if (!batch.length) break;
      for (var ent of batch) await uploadEntry(ent, dirPath);
    }
  }
}

// Chunked uploader (port of sendinator's pattern). Each file: create -> chunk*N (with
// per-chunk SHA-256 hash + infinite retry/backoff) -> finalize. Up to PARALLEL_FILES
// uploads run concurrently. Network blips are recoverable per-chunk; a tab close mid-
// upload leaves the server's chunk dir intact so a subsequent attempt could resume
// (resume UI is future work — for now we leave abandoned uploads to the 24h GC).
const PARALLEL_FILES = 4;
const RETRY_MAX_WAIT_MS = 8000;

async function sha256Hex(buffer) {
  var hb = await crypto.subtle.digest('SHA-256', buffer);
  return Array.from(new Uint8Array(hb)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function makeUploadRow(label) {
  var list = document.getElementById('uploadList');
  var row = document.createElement('div');
  row.style = 'padding:6px 0;border-bottom:1px solid #1f1f1f';
  row.innerHTML = '<div style="display:flex;justify-content:space-between;gap:8px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1"></span><small style="white-space:nowrap"></small></div><div class="progress"><div></div></div>';
  row.querySelector('span').textContent = label;
  list.appendChild(row);
  return {
    bar: row.querySelector('.progress > div'),
    sm:  row.querySelector('small'),
  };
}

async function uploadFiles(files, dir) {
  var imgs = Array.from(files).filter(f => f.type && f.type.startsWith('image/'));
  if (imgs.length === 0) return;

  var rows = imgs.map(f => ({
    file: f,
    ui: makeUploadRow((dir === cwdPath ? '' : dir.slice(cwdPath.length)) + f.name),
  }));

  // Worker pool: PARALLEL_FILES uploads in flight at once.
  var next = 0;
  async function worker() {
    while (next < rows.length) {
      var i = next++;
      try {
        await uploadOneFile(rows[i].file, dir, rows[i].ui);
      } catch (e) {
        rows[i].ui.sm.textContent = 'FAIL: ' + (e.message || e);
        rows[i].ui.sm.style.color = '#ff8585';
      }
    }
  }
  await Promise.all(Array.from({length: PARALLEL_FILES}, worker));
}

async function uploadOneFile(file, dir, ui) {
  // 1. create
  ui.sm.textContent = 'starting…';
  var createRes = await fetchJson('/api/upload/create', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ filename: file.name, size: file.size, targetFolder: dir }),
  });
  var id = createRes.id;
  var chunkSize = createRes.chunkSize;
  var totalChunks = createRes.totalChunks;

  // 2. chunk loop with infinite retry
  for (var idx = 0; idx < totalChunks; idx++) {
    var start = idx * chunkSize;
    var end = Math.min(start + chunkSize, file.size);
    var blob = file.slice(start, end);
    var buf = await blob.arrayBuffer();
    var hash = await sha256Hex(buf);

    var attempt = 0;
    while (true) {
      try {
        var r = await fetch('/api/upload/chunk/' + id + '/' + idx, {
          method: 'POST',
          headers: { 'X-Chunk-Hash': hash },
          body: buf,
        });
        if (!r.ok) {
          var errBody = await r.json().catch(() => ({ error: 'http ' + r.status }));
          throw new Error(errBody.error || 'chunk failed');
        }
        break;
      } catch (e) {
        attempt++;
        var wait = Math.min(attempt * 1000, RETRY_MAX_WAIT_MS);
        ui.sm.textContent = 'retry ' + attempt + ' in ' + (wait/1000) + 's (' + (e.message || e) + ')';
        ui.sm.style.color = '#fc0';
        await new Promise(res => setTimeout(res, wait));
      }
    }
    ui.bar.style.width = ((idx + 1) / totalChunks * 100) + '%';
    ui.sm.textContent = (idx + 1) + '/' + totalChunks + ' chunks';
    ui.sm.style.color = '';
  }

  // 3. finalize
  ui.sm.textContent = 'finalizing…';
  await fetchJson('/api/upload/finalize/' + id, { method: 'POST' });
  ui.bar.style.width = '100%';
  ui.sm.textContent = 'OK';
  ui.sm.style.color = '#9bff9b';
}

async function fetchJson(url, opts) {
  opts = opts || {};
  opts.credentials = 'same-origin';  // send cookies
  var r = await fetch(url, opts);
  var j = null;
  try { j = await r.json(); } catch {}
  if (!r.ok) {
    var msg = (j && j.error) ? j.error : ('http ' + r.status);
    throw new Error(msg);
  }
  return j;
}

// initial path from query
var qp = new URLSearchParams(location.search).get('p');
if (qp) cwdPath = qp;
document.getElementById('cwd').textContent = cwdPath;

checkAuth();
</script>
